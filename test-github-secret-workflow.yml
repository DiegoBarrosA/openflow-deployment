name: Test Secret Decode

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test secret decode
        run: |
          echo "Testing WALLET_DECODE_TEST secret..."
          TEST_SECRET='${{ secrets.WALLET_DECODE_TEST }}'
          
          if [ -z "$TEST_SECRET" ]; then
            echo "❌ Secret is empty"
            exit 1
          fi
          
          echo "Secret length: ${#TEST_SECRET} characters"
          echo "First 50 chars: ${TEST_SECRET:0:50}..."
          
          if echo "$TEST_SECRET" | base64 -d > /tmp/decoded.txt 2>/dev/null; then
            DECODED=$(cat /tmp/decoded.txt)
            echo "✅ Decoded successfully: $DECODED"
            
            if [ "$DECODED" = "test-secret-value-12345" ]; then
              echo "✅ Secret value matches expected!"
            else
              echo "❌ Secret value doesn't match"
              exit 1
            fi
          else
            echo "❌ Failed to decode secret (invalid base64)"
            exit 1
          fi







