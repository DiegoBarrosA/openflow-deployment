name: Deploy (on image update or manual)

on:
  repository_dispatch:
    types: [image_update]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: openflow-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/


      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Set backend/frontend image env vars (lowercase owner)
        id: set-images
        run: |
          REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=$REPO_OWNER_LC/openflow-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=$REPO_OWNER_LC/openflow-frontend" >> $GITHUB_ENV

      - name: Resolve image tags
        run: |
          # Default images
          DEFAULT_BACKEND="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest"
          DEFAULT_FRONTEND="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Processing repository_dispatch payload"
            if [ -n "${{ github.event.client_payload.backend_image }}" ] && [ "${{ github.event.client_payload.backend_image }}" != "null" ]; then
              echo "BACKEND_IMAGE=${{ github.event.client_payload.backend_image }}" >> $GITHUB_ENV
            else
              echo "BACKEND_IMAGE=$DEFAULT_BACKEND" >> $GITHUB_ENV
            fi

            if [ -n "${{ github.event.client_payload.frontend_image }}" ] && [ "${{ github.event.client_payload.frontend_image }}" != "null" ]; then
              echo "FRONTEND_IMAGE=${{ github.event.client_payload.frontend_image }}" >> $GITHUB_ENV
            else
              echo "FRONTEND_IMAGE=$DEFAULT_FRONTEND" >> $GITHUB_ENV
            fi
          else
            echo "Using default latest images"
            echo "BACKEND_IMAGE=$DEFAULT_BACKEND" >> $GITHUB_ENV
            echo "FRONTEND_IMAGE=$DEFAULT_FRONTEND" >> $GITHUB_ENV
          fi

      - name: Create Oracle Database Secret
        run: |
          kubectl create secret generic oracle-db-secret \
            --from-literal=username='${{ secrets.ORACLE_DB_USERNAME }}' \
            --from-literal=password='${{ secrets.ORACLE_DB_PASSWORD }}' \
            --from-literal=db-url='${{ secrets.ORACLE_DB_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Application Secrets
        run: |
          kubectl create secret generic app-secrets \
            --from-literal=jwt-secret='${{ secrets.JWT_SECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing GitHub CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi
          gh --version

      - name: Verify Environment Secrets Exist
        run: |
          set +e  # Don't fail if GitHub CLI commands fail
          ENV_NAME="${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}"
          echo "Verifying secrets exist in environment: $ENV_NAME"
          echo ""
          
          if command -v gh >/dev/null 2>&1; then
            echo "Authenticating GitHub CLI with GITHUB_TOKEN..."
            echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token 2>&1 || echo "Note: GitHub CLI auth may not be needed in workflow context"
            echo ""
            
            echo "Checking secrets using GitHub CLI..."
            SECRET_LIST=$(gh secret list --repo ${{ github.repository }} --env "$ENV_NAME" 2>&1)
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              if echo "$SECRET_LIST" | grep -q ORACLE_WALLET; then
                echo "✅ Found ORACLE_WALLET secrets in environment:"
                echo "$SECRET_LIST" | grep ORACLE_WALLET
                WALLET_COUNT=$(echo "$SECRET_LIST" | grep -c ORACLE_WALLET || echo "0")
                echo "   Total ORACLE_WALLET secrets: $WALLET_COUNT (expected: 7)"
              else
                echo "❌ No ORACLE_WALLET secrets found in environment"
                echo "Full secret list:"
                echo "$SECRET_LIST"
              fi
            else
              echo "⚠️  GitHub CLI command failed (exit code: $EXIT_CODE)"
              echo "   This might be due to permissions or authentication"
              echo "   Output: $SECRET_LIST"
              echo ""
              echo "   You can verify manually at:"
              echo "   https://github.com/${{ github.repository }}/settings/environments/$ENV_NAME/secrets"
            fi
          else
            echo "⚠️  GitHub CLI not available in workflow"
            echo "   Verify secrets manually at:"
            echo "   https://github.com/${{ github.repository }}/settings/environments/$ENV_NAME/secrets"
          fi
          echo ""

      - name: Test Environment Secret Access
        run: |
          set +e  # Don't fail on errors in this diagnostic step
          ENV_NAME="${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}"
          echo "🧪 Testing Environment Secret Access"
          echo "======================================"
          echo ""
          echo "Environment: $ENV_NAME"
          echo "Repository: ${{ github.repository }}"
          echo "GITHUB_ENVIRONMENT: ${GITHUB_ENVIRONMENT:-not set}"
          echo ""
          
          # Check if we're actually in an environment context
          if [ -z "$GITHUB_ENVIRONMENT" ]; then
            echo "⚠️  WARNING: GITHUB_ENVIRONMENT is not set!"
            echo "   This means the workflow might not be running in the environment context"
            echo "   Environment secrets won't be accessible if this is the case"
          else
            echo "✅ GITHUB_ENVIRONMENT is set to: $GITHUB_ENVIRONMENT"
            if [ "$GITHUB_ENVIRONMENT" != "$ENV_NAME" ]; then
              echo "   ⚠️  WARNING: GITHUB_ENVIRONMENT ($GITHUB_ENVIRONMENT) doesn't match expected ($ENV_NAME)"
            fi
          fi
          echo ""
          
          # Test 1: Try to access a test secret (if it exists)
          echo "Test 1: Checking if TEST_SECRET exists and is accessible..."
          TEST_SECRET_VAL="${{ secrets.TEST_SECRET }}"
          if [ -z "$TEST_SECRET_VAL" ]; then
            echo "   ℹ️  TEST_SECRET not set (this is OK - it's just for testing)"
          else
            TEST_LEN=${#TEST_SECRET_VAL}
            echo "   ✅ TEST_SECRET is accessible (length: $TEST_LEN chars)"
            if [ $TEST_LEN -eq 1 ]; then
              echo "   ⚠️  WARNING: TEST_SECRET is only 1 character - might indicate access issue"
            fi
          fi
          echo ""
          
          # Test 2: Try to access one of the wallet secrets and check its properties
          echo "Test 2: Testing ORACLE_WALLET_CWALLET access..."
          WALLET_SECRET_VAL="${{ secrets.ORACLE_WALLET_CWALLET }}"
          WALLET_LEN=${#WALLET_SECRET_VAL}
          echo "   Secret length: $WALLET_LEN characters"
          
          if [ -z "$WALLET_SECRET_VAL" ]; then
            echo "   ❌ Secret is empty (null/undefined)"
          elif [ "$WALLET_SECRET_VAL" = "" ]; then
            echo "   ❌ Secret is empty string"
          elif [ $WALLET_LEN -eq 1 ]; then
            echo "   ❌ CRITICAL: Secret is only 1 character!"
            echo "   This usually means the secret value is actually empty or corrupted in GitHub"
            echo ""
            echo "   Analyzing the single character:"
            CHAR_HEX=$(echo -n "$WALLET_SECRET_VAL" | od -An -tx1 | tr -d ' \n')
            CHAR_VISIBLE=$(echo -n "$WALLET_SECRET_VAL" | cat -A)
            CHAR_ASCII=$(printf "%d" "'$WALLET_SECRET_VAL")
            echo "   - Hex: 0x$CHAR_HEX"
            echo "   - ASCII code: $CHAR_ASCII"
            echo "   - Visible: '$CHAR_VISIBLE'"
            echo ""
            if [ "$CHAR_ASCII" -eq 0 ] || [ -z "$CHAR_VISIBLE" ] || [ "$CHAR_VISIBLE" = "$" ]; then
              echo "   ⚠️  The character appears to be null/empty/placeholder"
              echo "   This strongly suggests the secret is empty in GitHub"
            fi
            echo ""
            echo "   Possible causes:"
            echo "   1. Secret was uploaded but value is actually empty (most likely)"
            echo "   2. Secret upload failed silently"
            echo "   3. GitHub Actions bug with environment secrets"
            echo ""
            echo "   SOLUTION: Re-upload the secret using:"
            echo "   ./upload-wallet-to-github.sh"
            echo "   Make sure to choose option 1 (Environment level) and verify upload succeeds"
          elif [ $WALLET_LEN -lt 10 ]; then
            echo "   ⚠️  WARNING: Secret is suspiciously short ($WALLET_LEN chars)"
          elif [ $WALLET_LEN -gt 100 ]; then
            echo "   ✅ Secret appears to have valid length"
            echo "   First 20 chars (base64 preview): ${WALLET_SECRET_VAL:0:20}..."
          else
            echo "   ⚠️  Secret length is $WALLET_LEN (expected 1000+ for wallet files)"
          fi
          echo ""
          
          # Test 3: Check if we can access secrets at all in this context
          echo "Test 3: Checking secret access context..."
          echo "   GITHUB_ENVIRONMENT: ${GITHUB_ENVIRONMENT:-not set}"
          echo "   Workflow environment variable: $ENV_NAME"
          if [ -z "$GITHUB_ENVIRONMENT" ]; then
            echo "   ❌ CRITICAL: GITHUB_ENVIRONMENT is not set!"
            echo "   This means the workflow is NOT running in environment context"
            echo "   Environment secrets will NOT be accessible"
            echo "   Possible causes:"
            echo "   1. Environment requires approval (check workflow run for 'Review deployments')"
            echo "   2. Environment protection rules are blocking execution"
            echo "   3. Environment doesn't exist or is misconfigured"
          elif [ "$GITHUB_ENVIRONMENT" != "$ENV_NAME" ]; then
            echo "   ⚠️  WARNING: GITHUB_ENVIRONMENT ($GITHUB_ENVIRONMENT) doesn't match expected ($ENV_NAME)"
          else
            echo "   ✅ Environment context is properly set"
          fi
          echo ""
          
          # Test 4: Check if other secrets (like AWS) are accessible
          echo "Test 4: Checking if other environment secrets are accessible..."
          AWS_KEY_LEN=${#AWS_ACCESS_KEY_ID:-0}
          if [ $AWS_KEY_LEN -gt 0 ]; then
            echo "   ✅ AWS_ACCESS_KEY_ID is accessible (length: $AWS_KEY_LEN chars)"
            echo "   This suggests environment context IS working for some secrets"
          else
            echo "   ⚠️  AWS_ACCESS_KEY_ID is not accessible"
            echo "   This suggests environment context might not be working"
          fi
          echo ""
          
          # Test 4: Try to decode a small portion to see if it's valid base64
          if [ $WALLET_LEN -gt 10 ]; then
            echo "Test 4: Testing base64 decode of first 100 characters..."
            FIRST_100="${WALLET_SECRET_VAL:0:100}"
            if echo -n "$FIRST_100" | base64 -d >/dev/null 2>&1; then
              echo "   ✅ First 100 chars are valid base64"
            else
              echo "   ❌ First 100 chars are NOT valid base64"
              echo "   This suggests the secret value is corrupted or incorrectly set"
            fi
          else
            echo "Test 4: Skipped (secret too short to test)"
          fi
          echo ""
          
          echo "======================================"
          echo "Test Summary:"
          if [ $WALLET_LEN -gt 1000 ]; then
            echo "✅ ORACLE_WALLET_CWALLET appears to be accessible and valid"
          elif [ $WALLET_LEN -gt 10 ]; then
            echo "⚠️  ORACLE_WALLET_CWALLET is accessible but shorter than expected"
          else
            echo "❌ ORACLE_WALLET_CWALLET is not accessible or is empty"
            echo "   Action required: Check environment secrets in GitHub UI"
          fi
          echo ""

      - name: Check Wallet Secrets
        run: |
          # Check if wallet secrets are set (non-empty)
          # Note: GitHub Actions masks secret values in logs, so we can only check if they exist
          echo "Checking wallet secrets..."
          
          SECRETS_OK=1
          
          if [ -z "${{ secrets.ORACLE_WALLET_CWALLET }}" ]; then
            echo "❌ ORACLE_WALLET_CWALLET is missing or empty"
            SECRETS_OK=0
          else
            echo "✅ ORACLE_WALLET_CWALLET is set"
          fi
          
          if [ -z "${{ secrets.ORACLE_WALLET_EWALLET }}" ]; then
            echo "❌ ORACLE_WALLET_EWALLET is missing or empty"
            SECRETS_OK=0
          else
            echo "✅ ORACLE_WALLET_EWALLET is set"
          fi
          
          if [ -z "${{ secrets.ORACLE_WALLET_KEYSTORE }}" ]; then
            echo "❌ ORACLE_WALLET_KEYSTORE is missing or empty"
            SECRETS_OK=0
          else
            echo "✅ ORACLE_WALLET_KEYSTORE is set"
          fi
          
          if [ -z "${{ secrets.ORACLE_WALLET_OJDBC }}" ]; then
            echo "❌ ORACLE_WALLET_OJDBC is missing or empty"
            SECRETS_OK=0
          else
            echo "✅ ORACLE_WALLET_OJDBC is set"
          fi
          
          if [ -z "${{ secrets.ORACLE_WALLET_SQLNET }}" ]; then
            echo "❌ ORACLE_WALLET_SQLNET is missing or empty"
            SECRETS_OK=0
          else
            echo "✅ ORACLE_WALLET_SQLNET is set"
          fi
          
          if [ -z "${{ secrets.ORACLE_WALLET_TNSNAMES }}" ]; then
            echo "❌ ORACLE_WALLET_TNSNAMES is missing or empty"
            SECRETS_OK=0
          else
            echo "✅ ORACLE_WALLET_TNSNAMES is set"
          fi
          
          if [ -z "${{ secrets.ORACLE_WALLET_TRUSTSTORE }}" ]; then
            echo "❌ ORACLE_WALLET_TRUSTSTORE is missing or empty"
            SECRETS_OK=0
          else
            echo "✅ ORACLE_WALLET_TRUSTSTORE is set"
          fi
          
          if [ $SECRETS_OK -eq 0 ]; then
            echo ""
            echo "❌ Some wallet secrets are missing or empty"
            echo ""
            echo "To fix this:"
            echo "1. Run: ./upload-wallet-to-github.sh"
            echo "2. Or manually set secrets in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          
          echo ""
          echo "✅ All wallet secrets are set"

      - name: Validate Wallet Secrets Format
        run: |
          set -e
          echo "Validating wallet secrets format (base64 character set)..."
          echo ""
          
          # Diagnostic: Check environment context
          echo "🔍 Diagnostic Information:"
          ENV_NAME="${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}"
          echo "   Environment: $ENV_NAME"
          echo "   Repository: ${{ github.repository }}"
          echo "   Workflow run ID: ${{ github.run_id }}"
          echo ""
          
          # Save secrets to files to verify actual content (avoid masking issues with ${#VAR})
          # Access secrets directly in run block, not via env: to avoid truncation
          mkdir -p secret-temp
          
          echo "Saving secrets to files to verify actual content..."
          echo "${{ secrets.ORACLE_WALLET_CWALLET }}" > secret-temp/cwallet.b64
          echo "${{ secrets.ORACLE_WALLET_EWALLET }}" > secret-temp/ewallet.b64
          echo "${{ secrets.ORACLE_WALLET_KEYSTORE }}" > secret-temp/keystore.b64
          echo "${{ secrets.ORACLE_WALLET_OJDBC }}" > secret-temp/ojdbc.b64
          echo "${{ secrets.ORACLE_WALLET_SQLNET }}" > secret-temp/sqlnet.b64
          echo "${{ secrets.ORACLE_WALLET_TNSNAMES }}" > secret-temp/tnsnames.b64
          echo "${{ secrets.ORACLE_WALLET_TRUSTSTORE }}" > secret-temp/truststore.b64
          
          # Check file sizes (more reliable than variable length checks)
          echo ""
          echo "Secret file sizes (actual content):"
          for file in secret-temp/*.b64; do
            size=$(wc -c < "$file")
            name=$(basename "$file" .b64)
            echo "   $name: $size bytes"
            if [ $size -le 1 ]; then
              echo "      ❌ File is empty or only 1 byte!"
            elif [ $size -lt 10 ]; then
              echo "      ⚠️  File is suspiciously small"
            elif [ $size -gt 100 ]; then
              echo "      ✅ File size looks valid"
            fi
          done
          echo ""
          
          # Read from files for validation (avoid variable truncation issues)
          ORACLE_WALLET_CWALLET_VAL=$(cat secret-temp/cwallet.b64)
          ORACLE_WALLET_EWALLET_VAL=$(cat secret-temp/ewallet.b64)
          ORACLE_WALLET_KEYSTORE_VAL=$(cat secret-temp/keystore.b64)
          ORACLE_WALLET_OJDBC_VAL=$(cat secret-temp/ojdbc.b64)
          ORACLE_WALLET_SQLNET_VAL=$(cat secret-temp/sqlnet.b64)
          ORACLE_WALLET_TNSNAMES_VAL=$(cat secret-temp/tnsnames.b64)
          ORACLE_WALLET_TRUSTSTORE_VAL=$(cat secret-temp/truststore.b64)
          
          # Diagnostic: Show raw lengths (before cleaning) to help debug
          echo "Raw secret lengths (before cleaning):"
          echo "   ORACLE_WALLET_CWALLET: ${#ORACLE_WALLET_CWALLET_VAL} chars"
          echo "   ORACLE_WALLET_EWALLET: ${#ORACLE_WALLET_EWALLET_VAL} chars"
          echo "   ORACLE_WALLET_KEYSTORE: ${#ORACLE_WALLET_KEYSTORE_VAL} chars"
          echo "   ORACLE_WALLET_OJDBC: ${#ORACLE_WALLET_OJDBC_VAL} chars"
          echo "   ORACLE_WALLET_SQLNET: ${#ORACLE_WALLET_SQLNET_VAL} chars"
          echo "   ORACLE_WALLET_TNSNAMES: ${#ORACLE_WALLET_TNSNAMES_VAL} chars"
          echo "   ORACLE_WALLET_TRUSTSTORE: ${#ORACLE_WALLET_TRUSTSTORE_VAL} chars"
          echo ""
          
          # Helper function to validate base64 format
          validate_base64() {
            local secret_value="$1"
            local secret_name="$2"
            
            # Check if secret is empty (before cleaning)
            if [ -z "$secret_value" ]; then
              echo "❌ $secret_name is empty or not set"
              echo "   Action: Re-upload this secret using: ./upload-wallet-to-github.sh"
              return 1
            fi
            
            # Strip whitespace and newlines for validation
            local cleaned=$(echo -n "$secret_value" | tr -d '\n\r\t ')
            
            # Check if secret is empty after cleaning
            if [ -z "$cleaned" ]; then
              echo "❌ $secret_name is empty (only whitespace)"
              echo "   Action: Re-upload this secret using: ./upload-wallet-to-github.sh"
              return 1
            fi
            
            # Check length is reasonable (base64 encoded wallet files should be substantial)
            # Even small text files like tnsnames.ora should be at least 100+ chars when base64 encoded
            if [ ${#cleaned} -lt 10 ]; then
              echo "❌ $secret_name is too short (${#cleaned} characters)"
              echo "   Expected: At least 100+ characters for base64-encoded wallet files"
              echo "   This indicates the secret is empty or incorrectly set"
              echo "   Action: Re-upload this secret using: ./upload-wallet-to-github.sh"
              return 1
            fi
            
            # Check base64 character set (A-Z, a-z, 0-9, +, /, =)
            # Allow padding with = at the end (0-2 characters)
            if ! echo "$cleaned" | grep -qE '^[A-Za-z0-9+/]*={0,2}$'; then
              echo "❌ $secret_name contains invalid base64 characters"
              echo "   Length: ${#cleaned} characters"
              echo "   Base64 should only contain: A-Z, a-z, 0-9, +, /, ="
              echo "   Action: Re-upload this secret using: ./upload-wallet-to-github.sh"
              return 1
            fi
            
            # Warn if suspiciously short (but still valid format)
            if [ ${#cleaned} -lt 100 ]; then
              echo "⚠️  $secret_name is shorter than expected (${#cleaned} chars)"
              echo "   Most wallet files should be 1000+ characters when base64 encoded"
              echo "   This might indicate an encoding issue, but format is valid"
            fi
            
            echo "✅ $secret_name format is valid (${#cleaned} characters)"
            return 0
          }
          
          VALIDATION_OK=1
          
          validate_base64 "$ORACLE_WALLET_CWALLET_VAL" "ORACLE_WALLET_CWALLET" || VALIDATION_OK=0
          validate_base64 "$ORACLE_WALLET_EWALLET_VAL" "ORACLE_WALLET_EWALLET" || VALIDATION_OK=0
          validate_base64 "$ORACLE_WALLET_KEYSTORE_VAL" "ORACLE_WALLET_KEYSTORE" || VALIDATION_OK=0
          validate_base64 "$ORACLE_WALLET_OJDBC_VAL" "ORACLE_WALLET_OJDBC" || VALIDATION_OK=0
          validate_base64 "$ORACLE_WALLET_SQLNET_VAL" "ORACLE_WALLET_SQLNET" || VALIDATION_OK=0
          validate_base64 "$ORACLE_WALLET_TNSNAMES_VAL" "ORACLE_WALLET_TNSNAMES" || VALIDATION_OK=0
          validate_base64 "$ORACLE_WALLET_TRUSTSTORE_VAL" "ORACLE_WALLET_TRUSTSTORE" || VALIDATION_OK=0
          
          echo ""
          
          if [ $VALIDATION_OK -eq 0 ]; then
            echo "❌ Some wallet secrets have invalid format"
            echo ""
            echo "🔧 Troubleshooting Steps:"
            echo ""
            echo "1. Check where secrets are set:"
            echo "   - Repository level: Settings → Secrets and variables → Actions"
            echo "   - Environment level: Settings → Environments → [environment] → Secrets"
            echo ""
            echo "2. If using environment (staging/production), secrets MUST be set at environment level"
            echo "   Current environment: ${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}"
            echo ""
            echo "3. Re-upload wallet secrets:"
            echo "   ./upload-wallet-to-github.sh"
            echo "   (This uploads to repository level - you may need to copy to environment level)"
            echo ""
            echo "4. Verify secrets exist:"
            echo "   ./verify-wallet-secrets.sh"
            echo ""
            echo "5. If secrets are at repository level but workflow uses environment:"
            echo "   - Copy secrets from repository to environment level, OR"
            echo "   - Remove environment requirement from workflow"
            exit 1
          fi
          
          echo "✅ All wallet secrets have valid base64 format"

      - name: Create Oracle Wallet Secret (from GH secrets)
        run: |
          set -e
          mkdir -p wallet-temp
          
          echo "Decoding wallet files from GitHub Secrets..."
          echo ""
          
          # Access secrets directly in run block (not via env:) to avoid truncation
          # Save to files first to preserve exact content
          echo "${{ secrets.ORACLE_WALLET_CWALLET }}" > wallet-temp/cwallet.b64
          echo "${{ secrets.ORACLE_WALLET_EWALLET }}" > wallet-temp/ewallet.b64
          echo "${{ secrets.ORACLE_WALLET_KEYSTORE }}" > wallet-temp/keystore.b64
          echo "${{ secrets.ORACLE_WALLET_OJDBC }}" > wallet-temp/ojdbc.b64
          echo "${{ secrets.ORACLE_WALLET_SQLNET }}" > wallet-temp/sqlnet.b64
          echo "${{ secrets.ORACLE_WALLET_TNSNAMES }}" > wallet-temp/tnsnames.b64
          echo "${{ secrets.ORACLE_WALLET_TRUSTSTORE }}" > wallet-temp/truststore.b64
          
          # Helper function to decode and verify
          decode_file() {
            local input_file="$1"
            local output_file="$2"
            local file_name="$3"
            
            # Check if input file exists and has content
            if [ ! -f "$input_file" ]; then
              echo "❌ Error: $file_name input file not found"
              return 1
            fi
            
            file_size=$(wc -c < "$input_file")
            if [ $file_size -le 1 ]; then
              echo "❌ Error: $file_name secret is empty (file size: $file_size bytes)"
              return 1
            fi
            
            # Read and clean the secret value (remove trailing newlines that echo might add)
            secret_value=$(cat "$input_file" | tr -d '\n\r\t ')
            
            # Check if secret is empty after cleaning
            if [ -z "$secret_value" ]; then
              echo "❌ Error: $file_name secret is empty after cleaning"
              return 1
            fi
            
            # Validate base64 character set (basic check)
            if ! echo "$secret_value" | grep -qE '^[A-Za-z0-9+/]*={0,2}$'; then
              echo "❌ Error: $file_name contains invalid base64 characters"
              echo "   File size: $file_size bytes"
              echo "   Cleaned length: ${#secret_value} characters"
              echo "   Re-upload using: ./upload-wallet-to-github.sh"
              return 1
            fi
            
            # Try to decode - suppress stderr but capture exit code
            if ! echo -n "$secret_value" | base64 -d > "$output_file" 2>/dev/null; then
              echo "❌ Error: Failed to decode $file_name"
              echo "   This usually means the secret is not valid base64"
              echo "   File size: $file_size bytes"
              echo "   Cleaned length: ${#secret_value} characters"
              echo "   Re-upload using: ./upload-wallet-to-github.sh"
              return 1
            fi
            
            # Check if decoded file is empty
            if [ ! -s "$output_file" ]; then
              echo "❌ Error: Decoded $file_name is empty"
              echo "   This might indicate the secret was incorrectly encoded"
              echo "   Re-upload using: ./upload-wallet-to-github.sh"
              return 1
            fi
            
            echo "✅ Decoded $file_name ($(wc -c < "$output_file") bytes)"
            return 0
          }
          
          # Decode each wallet file from the saved files
          decode_file wallet-temp/cwallet.b64 wallet-temp/cwallet.sso "cwallet.sso" || exit 1
          decode_file wallet-temp/ewallet.b64 wallet-temp/ewallet.p12 "ewallet.p12" || exit 1
          decode_file wallet-temp/keystore.b64 wallet-temp/keystore.jks "keystore.jks" || exit 1
          decode_file wallet-temp/ojdbc.b64 wallet-temp/ojdbc.properties "ojdbc.properties" || exit 1
          decode_file wallet-temp/sqlnet.b64 wallet-temp/sqlnet.ora "sqlnet.ora" || exit 1
          decode_file wallet-temp/tnsnames.b64 wallet-temp/tnsnames.ora "tnsnames.ora" || exit 1
          decode_file wallet-temp/truststore.b64 wallet-temp/truststore.jks "truststore.jks" || exit 1
          
          echo ""

          echo "Creating Kubernetes secret..."
          kubectl create secret generic oracle-wallet-secret \
            --from-file=cwallet.sso=wallet-temp/cwallet.sso \
            --from-file=ewallet.p12=wallet-temp/ewallet.p12 \
            --from-file=keystore.jks=wallet-temp/keystore.jks \
            --from-file=ojdbc.properties=wallet-temp/ojdbc.properties \
            --from-file=sqlnet.ora=wallet-temp/sqlnet.ora \
            --from-file=tnsnames.ora=wallet-temp/tnsnames.ora \
            --from-file=truststore.jks=wallet-temp/truststore.jks \
            --dry-run=client -o yaml | kubectl apply -f -

          rm -rf wallet-temp secret-temp
          echo "✅ Oracle wallet secret created successfully"

      - name: Create GHCR Image Pull Secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          kubectl apply -f kube.yaml

      - name: Update deployment images
        run: |
          # Wait for deployments to exist (timeout ~60s)
          for i in {1..30}; do
            if kubectl get deployment openflow-backend >/dev/null 2>&1 && kubectl get deployment openflow-frontend >/dev/null 2>&1; then
              echo "Deployments found"
              break
            fi
            echo "Waiting for deployments to be created... ($i/30)"
            sleep 2
          done

          kubectl set image deployment/openflow-backend backend=$BACKEND_IMAGE || true
          kubectl set image deployment/openflow-frontend frontend=$FRONTEND_IMAGE || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/openflow-backend --timeout=600s || true
          kubectl rollout status deployment/openflow-frontend --timeout=600s || true

      - name: Get service URLs
        run: |
          echo "Backend URL: http://$(kubectl get svc openflow-backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'):8080"
          echo "Frontend URL: http://$(kubectl get svc openflow-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
