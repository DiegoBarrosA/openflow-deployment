name: Deploy (on image update or manual)

on:
  repository_dispatch:
    types: [image_update]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: openflow-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.event.client_payload.environment || 'staging' }}
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/


      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Set backend/frontend image env vars (lowercase owner)
        id: set-images
        run: |
          REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=$REPO_OWNER_LC/openflow-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=$REPO_OWNER_LC/openflow-frontend" >> $GITHUB_ENV

      - name: Resolve image tags
        run: |
          # Default images
          DEFAULT_BACKEND="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest"
          DEFAULT_FRONTEND="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Processing repository_dispatch payload"
            if [ -n "${{ github.event.client_payload.backend_image }}" ] && [ "${{ github.event.client_payload.backend_image }}" != "null" ]; then
              echo "BACKEND_IMAGE=${{ github.event.client_payload.backend_image }}" >> $GITHUB_ENV
            else
              echo "BACKEND_IMAGE=$DEFAULT_BACKEND" >> $GITHUB_ENV
            fi

            if [ -n "${{ github.event.client_payload.frontend_image }}" ] && [ "${{ github.event.client_payload.frontend_image }}" != "null" ]; then
              echo "FRONTEND_IMAGE=${{ github.event.client_payload.frontend_image }}" >> $GITHUB_ENV
            else
              echo "FRONTEND_IMAGE=$DEFAULT_FRONTEND" >> $GITHUB_ENV
            fi
          else
            echo "Using default latest images"
            echo "BACKEND_IMAGE=$DEFAULT_BACKEND" >> $GITHUB_ENV
            echo "FRONTEND_IMAGE=$DEFAULT_FRONTEND" >> $GITHUB_ENV
          fi

      - name: Create Oracle Database Secret
        run: |
          kubectl create secret generic oracle-db-secret \
            --from-literal=username='${{ secrets.ORACLE_DB_USERNAME }}' \
            --from-literal=password='${{ secrets.ORACLE_DB_PASSWORD }}' \
            --from-literal=db-url='${{ secrets.ORACLE_DB_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Application Secrets
        run: |
          kubectl create secret generic app-secrets \
            --from-literal=jwt-secret='${{ secrets.JWT_SECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Oracle Wallet Secret (from GH secrets)
        run: |
          set -e
          
          # Check if wallet secrets are set
          WALLET_SECRETS=(
            "ORACLE_WALLET_CWALLET"
            "ORACLE_WALLET_EWALLET"
            "ORACLE_WALLET_KEYSTORE"
            "ORACLE_WALLET_OJDBC"
            "ORACLE_WALLET_SQLNET"
            "ORACLE_WALLET_TNSNAMES"
            "ORACLE_WALLET_TRUSTSTORE"
          )
          
          MISSING_SECRETS=()
          for secret in "${WALLET_SECRETS[@]}"; do
            if [ -z "${!secret}" ]; then
              MISSING_SECRETS+=("$secret")
            fi
          done
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Error: Missing required GitHub Secrets:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "Please set these secrets in: Settings → Secrets and variables → Actions"
            echo "Use ./upload-wallet-to-github.sh to upload wallet files automatically"
            exit 1
          fi
          
          mkdir -p wallet-temp
          
          # Decode wallet files with error checking
          echo "Decoding wallet files..."
          
          decode_wallet_file() {
            local secret_name=$1
            local output_file=$2
            local secret_value="${!secret_name}"
            
            if [ -z "$secret_value" ]; then
              echo "❌ Error: $secret_name is empty"
              return 1
            fi
            
            if ! echo "$secret_value" | base64 -d > "$output_file" 2>/dev/null; then
              echo "❌ Error: Failed to decode $secret_name (invalid base64 or empty)"
              return 1
            fi
            
            if [ ! -s "$output_file" ]; then
              echo "❌ Error: Decoded $secret_name is empty"
              return 1
            fi
            
            echo "✅ Decoded $secret_name"
            return 0
          }
          
          # Export secrets as environment variables for the function
          export ORACLE_WALLET_CWALLET='${{ secrets.ORACLE_WALLET_CWALLET }}'
          export ORACLE_WALLET_EWALLET='${{ secrets.ORACLE_WALLET_EWALLET }}'
          export ORACLE_WALLET_KEYSTORE='${{ secrets.ORACLE_WALLET_KEYSTORE }}'
          export ORACLE_WALLET_OJDBC='${{ secrets.ORACLE_WALLET_OJDBC }}'
          export ORACLE_WALLET_SQLNET='${{ secrets.ORACLE_WALLET_SQLNET }}'
          export ORACLE_WALLET_TNSNAMES='${{ secrets.ORACLE_WALLET_TNSNAMES }}'
          export ORACLE_WALLET_TRUSTSTORE='${{ secrets.ORACLE_WALLET_TRUSTSTORE }}'
          
          decode_wallet_file ORACLE_WALLET_CWALLET wallet-temp/cwallet.sso || exit 1
          decode_wallet_file ORACLE_WALLET_EWALLET wallet-temp/ewallet.p12 || exit 1
          decode_wallet_file ORACLE_WALLET_KEYSTORE wallet-temp/keystore.jks || exit 1
          decode_wallet_file ORACLE_WALLET_OJDBC wallet-temp/ojdbc.properties || exit 1
          decode_wallet_file ORACLE_WALLET_SQLNET wallet-temp/sqlnet.ora || exit 1
          decode_wallet_file ORACLE_WALLET_TNSNAMES wallet-temp/tnsnames.ora || exit 1
          decode_wallet_file ORACLE_WALLET_TRUSTSTORE wallet-temp/truststore.jks || exit 1

          echo "Creating Kubernetes secret..."
          kubectl create secret generic oracle-wallet-secret \
            --from-file=cwallet.sso=wallet-temp/cwallet.sso \
            --from-file=ewallet.p12=wallet-temp/ewallet.p12 \
            --from-file=keystore.jks=wallet-temp/keystore.jks \
            --from-file=ojdbc.properties=wallet-temp/ojdbc.properties \
            --from-file=sqlnet.ora=wallet-temp/sqlnet.ora \
            --from-file=tnsnames.ora=wallet-temp/tnsnames.ora \
            --from-file=truststore.jks=wallet-temp/truststore.jks \
            --dry-run=client -o yaml | kubectl apply -f -

          rm -rf wallet-temp
          echo "✅ Oracle wallet secret created successfully"

      - name: Create GHCR Image Pull Secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          kubectl apply -f kube.yaml

      - name: Update deployment images
        run: |
          # Wait for deployments to exist (timeout ~60s)
          for i in {1..30}; do
            if kubectl get deployment openflow-backend >/dev/null 2>&1 && kubectl get deployment openflow-frontend >/dev/null 2>&1; then
              echo "Deployments found"
              break
            fi
            echo "Waiting for deployments to be created... ($i/30)"
            sleep 2
          done

          kubectl set image deployment/openflow-backend backend=$BACKEND_IMAGE || true
          kubectl set image deployment/openflow-frontend frontend=$FRONTEND_IMAGE || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/openflow-backend --timeout=600s || true
          kubectl rollout status deployment/openflow-frontend --timeout=600s || true

      - name: Get service URLs
        run: |
          echo "Backend URL: http://$(kubectl get svc openflow-backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'):8080"
          echo "Frontend URL: http://$(kubectl get svc openflow-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
