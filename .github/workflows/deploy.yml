name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Authenticate to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull backend image from ghcr.io
        run: |
          podman pull ghcr.io/${{ github.repository_owner }}/openflow-backend:latest
          podman tag ghcr.io/${{ github.repository_owner }}/openflow-backend:latest openflow-backend:latest

      - name: Pull frontend image from ghcr.io
        run: |
          podman pull ghcr.io/${{ github.repository_owner }}/openflow-frontend:latest
          podman tag ghcr.io/${{ github.repository_owner }}/openflow-frontend:latest openflow-frontend:latest

      - name: Pre-cleanup
        run: |
          # Stop and remove all pods/containers
          podman pod ls -q | xargs -r podman pod stop || true
          podman pod ls -q | xargs -r podman pod rm || true
          podman container ls -aq | xargs -r podman container rm -f || true
          # Remove network
          podman network rm openflow-network || true
          # Kill any processes on ports 3000 and 8080
          sudo fuser -k 3000/tcp || true
          sudo fuser -k 8080/tcp || true

      - name: Create network
        run: |
          podman network create openflow-network || true

      - name: Deploy stack
        run: |
          podman play kube --network openflow-network --publish 8080:8080 --publish 3000:3000 kube-test.yaml

      - name: Wait for services
        run: |
          sleep 60

      - name: Check pods
        run: |
          podman pod ps
          podman container ls

      - name: Test backend
        run: |
          curl -f http://localhost:8080/api/auth/login -X POST -H "Content-Type: application/json" -d '{"username":"admin","password":"admin123"}' || exit 1

      - name: Test frontend
        run: |
          curl -f http://localhost:3000 || exit 1

      - name: Cleanup
        if: always()
        run: |
          # Stop and remove all pods/containers
          podman pod ls -q | xargs -r podman pod stop || true
          podman pod ls -q | xargs -r podman pod rm || true
          podman container ls -aq | xargs -r podman container rm -f || true
          # Force remove network
          podman network rm -f openflow-network || true
