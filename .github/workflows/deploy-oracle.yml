name: Deploy to AWS EKS with Oracle ADB

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production


  REGISTRY: ghcr.io
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: openflow-cluster
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v4

      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openflow-backend
          path: openflow-backend

      - name: Checkout frontend code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openflow-frontend
          path: openflow-frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set backend/frontend image env vars (lowercase owner)
        id: set-images
        run: |
          REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=$REPO_OWNER_LC/openflow-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=$REPO_OWNER_LC/openflow-frontend" >> $GITHUB_ENV

      - name: Set default backend build output
        id: build-backend
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest" >> $GITHUB_OUTPUT

      - name: Set default frontend build output
        id: build-frontend
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest" >> $GITHUB_OUTPUT

  deploy-to-eks:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install AWS CLI v2
        run: |
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed: $(aws --version)"
          else
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            # Use --update to handle preexisting installs; if that fails, try without and allow step to fail
            sudo ./aws/install --update || sudo ./aws/install
          fi

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Create Oracle Database Secret
        run: |
          kubectl create secret generic oracle-db-secret \
            --from-literal=username='${{ secrets.ORACLE_DB_USERNAME }}' \
            --from-literal=password='${{ secrets.ORACLE_DB_PASSWORD }}' \
            --from-literal=db-url='${{ secrets.ORACLE_DB_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Application Secrets
        run: |
          kubectl create secret generic app-secrets \
            --from-literal=jwt-secret='${{ secrets.JWT_SECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Oracle Wallet Secret
        run: |
          # Create temporary directory for wallet files
          mkdir -p wallet-temp

          # Decode and save wallet files from secrets
          echo '${{ secrets.ORACLE_WALLET_CWALLET }}' | base64 -d > wallet-temp/cwallet.sso
          echo '${{ secrets.ORACLE_WALLET_EWALLET }}' | base64 -d > wallet-temp/ewallet.p12
          echo '${{ secrets.ORACLE_WALLET_KEYSTORE }}' | base64 -d > wallet-temp/keystore.jks
          echo '${{ secrets.ORACLE_WALLET_OJDBC }}' | base64 -d > wallet-temp/ojdbc.properties
          echo '${{ secrets.ORACLE_WALLET_SQLNET }}' | base64 -d > wallet-temp/sqlnet.ora
          echo '${{ secrets.ORACLE_WALLET_TNSNAMES }}' | base64 -d > wallet-temp/tnsnames.ora
          echo '${{ secrets.ORACLE_WALLET_TRUSTSTORE }}' | base64 -d > wallet-temp/truststore.jks

          # Create the secret
          kubectl create secret generic oracle-wallet-secret \
            --from-file=cwallet.sso=wallet-temp/cwallet.sso \
            --from-file=ewallet.p12=wallet-temp/ewallet.p12 \
            --from-file=keystore.jks=wallet-temp/keystore.jks \
            --from-file=ojdbc.properties=wallet-temp/ojdbc.properties \
            --from-file=sqlnet.ora=wallet-temp/sqlnet.ora \
            --from-file=tnsnames.ora=wallet-temp/tnsnames.ora \
            --from-file=truststore.jks=wallet-temp/truststore.jks \
            --dry-run=client -o yaml | kubectl apply -f -

          # Clean up
          rm -rf wallet-temp

      - name: Create GHCR Image Pull Secret
        run: |
          # Create image pull secret for GHCR access
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          kubectl apply -f kube.yaml

      - name: Update deployment images
        run: |
            # Wait for deployments to exist (timeout ~60s)
            for i in {1..30}; do
              if kubectl get deployment openflow-backend >/dev/null 2>&1 && kubectl get deployment openflow-frontend >/dev/null 2>&1; then
                echo "Deployments found"
                break
              fi
              echo "Waiting for deployments to be created... ($i/30)"
              sleep 2
            done

            # Determine backend image (prefer build output, fallback to default latest)
            BACKEND_IMG="${{ needs.build-and-push.outputs.backend-image }}"
            if [ -z "$BACKEND_IMG" ]; then
              BACKEND_IMG="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest"
            fi

            # Determine frontend image (prefer build output, fallback to default latest)
            FRONTEND_IMG="${{ needs.build-and-push.outputs.frontend-image }}"
            if [ -z "$FRONTEND_IMG" ]; then
              FRONTEND_IMG="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest"
            fi

            echo "Using backend image: $BACKEND_IMG"
            echo "Using frontend image: $FRONTEND_IMG"

            # Update images: use correct container names (backend, frontend)
            kubectl set image deployment/openflow-backend backend=$BACKEND_IMG || true
            kubectl set image deployment/openflow-frontend frontend=$FRONTEND_IMG || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/openflow-backend --timeout=600s
          kubectl rollout status deployment/openflow-frontend --timeout=600s

      - name: Get service URLs
        run: |
          echo "Backend URL: http://$(kubectl get svc openflow-backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'):8080"
          echo "Frontend URL: http://$(kubectl get svc openflow-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          echo "API Base URL: http://$(kubectl get svc openflow-backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'):8080/api"
