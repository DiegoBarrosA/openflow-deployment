---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openflow-backend
  labels:
    app: openflow-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openflow-backend
  template:
    metadata:
      labels:
        app: openflow-backend
    spec:
      # imagePullSecrets not needed for public packages
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/diegobarrosa/openflow-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: ORACLE_SERVICE_NAME
              valueFrom:
                secretKeyRef:
                  name: oracle-db-secret
                  key: db-url
            - name: ORACLE_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oracle-db-secret
                  key: username
            - name: ORACLE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oracle-db-secret
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret
            # CORS_ALLOWED_ORIGINS is dynamically set by the deployment workflow
            # to the frontend LoadBalancer URL after services are created
            # If not set by workflow, will default to http://localhost:3000 (from application.properties)
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000"  # Default for local development, will be overridden by workflow
            - name: TNS_ADMIN
              value: /app/wallet
            # Java system properties for Oracle wallet
            - name: JAVA_OPTS
              value: "-Doracle.net.wallet_location=(SOURCE=(METHOD=FILE)(METHOD_DATA=(DIRECTORY=/app/wallet)))"
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-ad-secret
                  key: tenant-id
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: azure-ad-secret
                  key: client-id
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: azure-ad-secret
                  key: client-secret
            - name: AZURE_ISSUER_URI
              valueFrom:
                secretKeyRef:
                  name: azure-ad-secret
                  key: issuer-uri
            - name: AZURE_JWK_SET_URI
              valueFrom:
                secretKeyRef:
                  name: azure-ad-secret
                  key: jwk-set-uri
            - name: AUTH_MODE
              valueFrom:
                secretKeyRef:
                  name: azure-ad-secret
                  key: auth-mode
          volumeMounts:
            - name: oracle-wallet
              mountPath: /app/wallet
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: oracle-wallet
          secret:
            secretName: oracle-wallet-secret
            defaultMode: 0444  # Make wallet files readable by all (required for Oracle JDBC)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openflow-frontend
  labels:
    app: openflow-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openflow-frontend
  template:
    metadata:
      labels:
        app: openflow-frontend
    spec:
      # imagePullSecrets not needed for public packages
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/diegobarrosa/openflow-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_BASE_URL
              value: "/api"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: openflow-backend
  labels:
    app: openflow-backend
spec:
  selector:
    app: openflow-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP  # Changed to ClusterIP - Ingress handles external access
---
apiVersion: v1
kind: Service
metadata:
  name: openflow-frontend
  labels:
    app: openflow-frontend
spec:
  selector:
    app: openflow-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP  # Changed to ClusterIP - Ingress handles external access
